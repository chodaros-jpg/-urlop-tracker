name: Supabase keepalive

# Supabase pauses free projects after 1 week without activity.
# This pings the database twice a week so the app keeps working.
on:
  schedule:
    - cron: "17 6 * * 1,4" # Monday and Thursday, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://ozvxhatujlgvpdczsrmc.supabase.co
          # Publishable key (public by design, same one the app uses in the browser)
          SUPABASE_KEY: sb_publishable_W0RfRBcZ960QIKLv7dVVIQ_3TJaLpyv
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
